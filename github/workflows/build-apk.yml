name: Build APK - بستان الحروف

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js www/
          cp -r icons www/

      - name: Create Capacitor Android project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor-community/text-to-speech@5
          npx cap init "Bustan Alhuruf" com.personal.bustanalhuruf --web-dir www
          npx cap add android
          npx cap sync android

      - name: App name and icon
        run: |
          RES=android/app/src/main/res
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">بستان الحروف</string>|' $RES/values/strings.xml
          sed -i 's|<string name="title_activity_main">.*</string>|<string name="title_activity_main">بستان الحروف</string>|' $RES/values/strings.xml
          rm -rf $RES/mipmap-anydpi-v26
          for d in $RES/mipmap-*; do
            cp icons/icon-192.png $d/ic_launcher.png
            cp icons/icon-192.png $d/ic_launcher_round.png
            cp icons/icon-192.png $d/ic_launcher_foreground.png
          done

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: bustan-alhuruf-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
