<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#6C4BD8">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>بستان الحروف</title>
<style>
:root{--p:#6C4BD8;--p2:#8F75F0;--bg:#FFF8EC;--ink:#2B2340;--mut:#7A7290;--ok:#2DBE7E;--bad:#FF5E6C;--y:#FFC93C;--o:#FF9F45;--b:#3FA9F5;--g:#4CC38A;--pk:#FF7EB6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:'Noto Sans Arabic','Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--ink);overscroll-behavior:none;user-select:none;-webkit-user-select:none}
.ar{font-family:'Noto Naskh Arabic','Amiri','Scheherazade New','Traditional Arabic','Times New Roman',serif}
button{font-family:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;box-shadow:0 3px 12px rgba(80,50,180,.25)}
header h1{flex:1;margin:0;font-size:19px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{width:42px;height:42px;border-radius:14px;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:20px;display:grid;place-items:center}
.starpill{background:#fff;color:var(--p);border-radius:20px;padding:6px 11px;font-weight:800;font-size:15px;white-space:nowrap}
main{padding:14px;max-width:720px;margin:0 auto;padding-bottom:50px}
h2,h3{margin:4px 0 12px}
h3{font-size:17px;color:var(--p)}
.mut{color:var(--mut)}
.center{text-align:center}
.card{background:#fff;border-radius:22px;padding:16px;box-shadow:0 4px 14px rgba(60,40,120,.08);margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.tile{border:0;border-radius:24px;padding:18px 8px;color:#fff;font-size:18px;font-weight:800;box-shadow:0 6px 0 rgba(0,0,0,.13);display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .1s}
.tile:active,.btn:active,.opt:active,.tl:active{transform:translateY(3px)}
.tile .ic{font-size:44px;line-height:1.2}
.tile small{font-weight:500;opacity:.95;font-size:13px}
.tile.wide{grid-column:1/-1;flex-direction:row;justify-content:center;gap:12px;padding:14px}
.tile.wide .ic{font-size:30px}
.btn{border:0;border-radius:18px;padding:12px 20px;background:var(--p);color:#fff;font-size:17px;font-weight:700;box-shadow:0 4px 0 rgba(0,0,0,.15);margin:4px}
.btn.ghost{background:#EFEAFF;color:var(--p)}
.btn.ok{background:var(--ok)}
.btn.red{background:var(--bad)}
.btn.big{font-size:20px;padding:14px 28px}
.row{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin:8px 0}
.mini{border:0;background:#EFEAFF;color:var(--p);border-radius:14px;padding:6px 12px;font-size:18px}
.hello{display:flex;align-items:center;gap:14px}
.av{font-size:48px;width:72px;height:72px;border-radius:50%;background:#FFF1C9;display:grid;place-items:center;flex-shrink:0}
.hi{font-size:22px;font-weight:800}
.garden .gt{font-weight:800;margin-bottom:6px}
.plants{font-size:30px;letter-spacing:2px;min-height:40px;line-height:1.4}
.plants .mut{font-size:15px;letter-spacing:0}
.bar{height:12px;background:#F1ECFF;border-radius:10px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--y),var(--o));border-radius:10px;transition:width .4s}
.lgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.lb{position:relative;border:0;border-radius:18px;background:#fff;box-shadow:0 4px 0 #E6DEFF;font-size:40px;padding:8px 0 4px;color:var(--ink)}
.lb small{display:block;font-size:12px;color:var(--mut);font-family:'Noto Sans Arabic',Tahoma,sans-serif}
.lb.done{background:#E9FBF2;box-shadow:0 4px 0 #BDEFD6}
.lb.done::after{content:'✓';position:absolute;top:4px;left:8px;font-size:14px;color:var(--ok);font-weight:900}
.bigletter{font-size:150px;line-height:1.25;color:var(--p);cursor:pointer}
.lname{font-size:30px;margin-bottom:6px}
.forms{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.form{background:#F7F4FF;border-radius:16px;padding:6px 2px;text-align:center}
.form div{font-size:46px;line-height:1.4;color:var(--ink)}
.form small{color:var(--mut);font-size:12px}
.words{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.wcard{border:0;background:#FFF6E0;border-radius:18px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.wcard .em{font-size:44px}
.wcard .ar{font-size:24px;color:var(--ink)}
.tracewrap{position:relative;width:min(300px,78vw);aspect-ratio:1;margin:6px auto;background:#fff;border:3px dashed #D9CEFF;border-radius:22px;overflow:hidden}
.tracewrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.chip{flex-shrink:0;border:0;width:52px;height:52px;border-radius:16px;background:#fff;box-shadow:0 3px 0 #E6DEFF;font-size:28px}
.chip.on{background:var(--p);color:#fff;box-shadow:0 3px 0 #4A2FB0}
.hgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.hgrid.three{grid-template-columns:repeat(3,1fr)}
.hb{border:0;border-radius:18px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;color:var(--ink)}
.hb .ar{font-size:44px;line-height:1.5}
.hb small{font-size:12px;color:var(--mut)}
.c0{background:#FFE3EF}.c1{background:#E2F2FF}.c2{background:#E4F8EE}.c3{background:#FFF1D6}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rc{border:0;border-radius:18px;background:#fff;box-shadow:0 4px 0 #E6DEFF;padding:10px 2px;display:flex;flex-direction:column;align-items:center}
.rc .em{font-size:38px}.rc .ar{font-size:24px;color:var(--ink)}
.rc.done{background:#E9FBF2;box-shadow:0 4px 0 #BDEFD6}
.huge{font-size:80px;line-height:1.2}
.rword{font-size:64px;line-height:1.5;color:var(--p);border-radius:18px;transition:all .3s;padding:0 10px;display:inline-block}
.rword.on{background:#FFF1C9;transform:scale(1.08)}
.syl,.units{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.sy{border:0;border-radius:18px;font-size:44px;padding:4px 18px;color:var(--ink);transition:transform .2s}
.sy.on{transform:scale(1.2);box-shadow:0 0 0 4px var(--y)}
.un{border:0;border-radius:16px;background:#F7F4FF;padding:4px 10px;display:flex;flex-direction:column;align-items:center;min-width:62px}
.un .ar{font-size:40px;line-height:1.5}.un small{font-size:12px;color:var(--mut);min-height:16px}
.prog{display:flex;justify-content:center;gap:6px;margin-bottom:12px}
.prog i{width:14px;height:14px;border-radius:50%;background:#E6DEFF}
.prog i.d{background:var(--ok)}.prog i.c{background:var(--y);transform:scale(1.2)}
.q{font-size:20px;font-weight:700;margin:4px 0 10px}
.bigplay{border:0;width:96px;height:96px;border-radius:50%;background:linear-gradient(135deg,var(--o),var(--y));font-size:44px;box-shadow:0 6px 0 #D9822F}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.opt{border:0;border-radius:24px;background:#fff;box-shadow:0 5px 0 #E6DEFF;font-size:70px;line-height:1.5;color:var(--ink)}
.opt.txt{font-size:20px;padding:18px 6px;font-weight:700;font-family:'Noto Sans Arabic',Tahoma,sans-serif}
.good{background:#D9F8E8!important;box-shadow:0 5px 0 #8EDDB6!important}
.wrong{background:#FFE1E4!important;animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.shake{animation:shake .4s}
.em.big{font-size:90px;line-height:1.2}
.slots{display:flex;justify-content:center;gap:8px;margin:12px 0 4px}
.slot{width:56px;height:64px;border-radius:14px;background:#F1ECFF;border:2px dashed #CDBFFF;display:grid;place-items:center;font-size:38px;color:var(--p)}
.slot.f{background:#E9FBF2;border:2px solid var(--ok);color:var(--ink)}
.built{font-size:54px;min-height:80px;color:var(--p)}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.tl{border:0;width:72px;height:80px;border-radius:18px;background:#fff;box-shadow:0 5px 0 #E6DEFF;font-size:44px;color:var(--ink)}
.tl.used{visibility:hidden}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mc{border:0;height:96px;border-radius:18px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-size:36px;box-shadow:0 4px 0 #4A2FB0;transition:transform .25s}
.mc .front{display:none}.mc.open{background:#fff;color:var(--ink);box-shadow:0 4px 0 #E6DEFF}
.mc.open .front{display:block}.mc.open .back{display:none}
.mc .front.ar{font-size:26px}.mc .front.em{font-size:44px}
.mc.done{background:#E9FBF2!important;box-shadow:0 4px 0 #BDEFD6!important}
.bh{display:flex;justify-content:space-between;align-items:center;font-size:18px;font-weight:700}
.tgt{font-size:44px;color:var(--p);vertical-align:middle}
#sky{position:relative;height:62vh;border-radius:24px;overflow:hidden;background:linear-gradient(#BFE6FF,#E8F7FF);box-shadow:inset 0 0 0 3px #fff}
.bub{position:absolute;bottom:-90px;width:72px;height:72px;border-radius:50%;border:0;color:#fff;font-size:40px;line-height:1;display:grid;place-items:center;box-shadow:inset -6px -8px 0 rgba(0,0,0,.12),0 4px 10px rgba(0,0,0,.1);animation:rise linear forwards;touch-action:manipulation}
@keyframes rise{to{transform:translateY(calc(-62vh - 110px))}}
.bub.pop{opacity:0;transition:opacity .25s}
.bub.nope{filter:grayscale(1);opacity:.4;transition:opacity .3s}
.cgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.story{font-size:30px;line-height:2.1;text-align:justify}
.sw{border-radius:10px;padding:0 3px;transition:background .2s;cursor:pointer}
.sw.on{background:#FFE58A}
.qq p{font-size:20px;font-weight:700;margin:12px 0 8px}
.qopts{display:flex;flex-wrap:wrap;gap:8px}
.qo{border:0;border-radius:16px;background:#F3EFFF;padding:10px 16px;font-size:20px;font-family:'Noto Naskh Arabic','Amiri',serif;color:var(--ink)}
.pcard{display:flex;align-items:center;gap:14px;width:100%;border:0;background:#fff;border-radius:22px;padding:14px;box-shadow:0 4px 0 #E6DEFF;margin-bottom:12px;font-size:20px;font-weight:700;color:var(--ink)}
.pcard .av{width:60px;height:60px;font-size:38px}
.avs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.avb{border:0;font-size:32px;padding:6px 0;border-radius:14px;background:#F7F4FF}
.avb.on{background:var(--y);box-shadow:0 0 0 3px var(--o)}
input[type=text],input[type=number]{width:100%;font-size:20px;padding:12px 14px;border-radius:16px;border:2px solid #E0D7FF;font-family:inherit;outline:none;text-align:center}
input:focus{border-color:var(--p)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.stat div{background:#F7F4FF;border-radius:16px;padding:10px 4px}
.stat b{display:block;font-size:26px;color:var(--p)}
.stat small{color:var(--mut)}
.chart{display:flex;align-items:flex-end;justify-content:space-between;height:120px;gap:6px;padding-top:10px}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--mut)}
.chart i{display:block;width:70%;background:linear-gradient(var(--p2),var(--p));border-radius:8px 8px 3px 3px;min-height:3px;margin-bottom:4px}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:8px 4px;border-bottom:1px solid #F0ECFA;text-align:right}
.weak{display:flex;flex-wrap:wrap;gap:8px}
.weak span{background:#FFE1E4;border-radius:12px;padding:4px 12px;font-size:28px}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:0;padding:10px;border-radius:14px;background:#F3EFFF;font-size:16px;color:var(--ink)}
.seg button.on{background:var(--p);color:#fff}
#toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:18px;font-size:16px;z-index:99;transition:transform .3s;max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
.fx{position:fixed;z-index:90;font-size:34px;pointer-events:none;animation:fly 1s ease-out forwards}
@keyframes fly{from{opacity:1;transform:translate(0,0) scale(.6)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.3)}}
.result .em{font-size:90px}
.result h2{font-size:28px}
#splash{position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,#6C4BD8,#9B7BFF 60%,#FFB86B);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;transition:opacity .6s}
#splash.hide{opacity:0;pointer-events:none}
#splash .tree{font-size:110px;animation:grow 1s ease-out}
#splash h1{font-size:46px;margin:6px 0;animation:up .9s .2s both}
#splash p{font-size:18px;opacity:.95;animation:up .9s .4s both}
.fl{position:absolute;font-size:44px;opacity:.85;animation:float 3s ease-in-out infinite}
@keyframes grow{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes up{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
@media (min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}.lgrid{grid-template-columns:repeat(7,1fr)}.rgrid{grid-template-columns:repeat(4,1fr)}.mem{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div id="splash">
  <span class="fl ar" style="top:14%;right:16%">أ</span>
  <span class="fl ar" style="top:20%;left:14%;animation-delay:.5s">ب</span>
  <span class="fl ar" style="bottom:20%;right:20%;animation-delay:1s">ت</span>
  <span class="fl ar" style="bottom:16%;left:18%;animation-delay:1.5s">ج</span>
  <div class="tree">🌳</div>
  <h1 class="ar">بستان الحروف</h1>
  <p>أتعلّم لغتي العربيّة وأنا ألعب</p>
</div>
<header>
  <button class="hbtn" id="backBtn" onclick="history.back()" aria-label="رجوع">➜</button>
  <h1 id="title">بستان الحروف</h1>
  <span class="starpill" id="stars">⭐ 0</span>
  <button class="hbtn" onclick="goHome()" aria-label="الرئيسيّة">🏠</button>
</header>
<main id="app"></main>
<div id="toast"></div>

const READ=[

function hName(u){
  if(u.includes('\u0651'))return 'شدّة';
  if(/[\u064B\u064C\u064D]/.test(u))return 'تنوين';
  if(u.includes('\u064E'))return 'فتحة';
  if(u.includes('\u064F'))return 'ضمّة';
  if(u.includes('\u0650'))return 'كسرة';
  if(u.includes('\u0652'))return 'سكون';
  if('اوىي'.includes(u))return 'مدّ';
  return '';
}

let arVoice=null;
function loadVoices(){if(!('speechSynthesis' in window))return;const v=speechSynthesis.getVoices();arVoice=v.find(x=>/^ar/i.test(x.lang))||null;}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
const isNative=!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
const NativeTTS=(isNative&&Capacitor.registerPlugin)?Capacitor.registerPlugin('TextToSpeech'):null;
function say(text,rate){
  rate=rate||DB.rate||0.8;
  return new Promise(res=>{
    let done=false;const fin=()=>{if(!done){done=true;res();}};
    setTimeout(fin,1800+text.length*350);
    if(NativeTTS){NativeTTS.stop().catch(()=>{}).finally(()=>NativeTTS.speak({text,lang:'ar-SA',rate:rate,pitch:1.1,volume:1,category:'playback'}).then(fin).catch(fin));return;}
    if(!('speechSynthesis' in window)){fin();return;}
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);u.lang='ar-SA';if(arVoice)u.voice=arVoice;u.rate=rate;u.pitch=1.1;u.onend=fin;u.onerror=fin;
    speechSynthesis.speak(u);
  });
}
function hush(){try{if(NativeTTS)NativeTTS.stop().catch(()=>{});else if('speechSynthesis' in window)speechSynthesis.cancel();}catch(e){}}
let AC;
function tone(f,d,type='sine',v=.15,when=0){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);const t=AC.currentTime+when;o.start(t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.stop(t+d);}catch(e){}}
function good(){tone(660,.15);tone(880,.25,'sine',.15,.12);burst();}
function bad(){tone(220,.25,'triangle',.12);if(navigator.vibrate)navigator.vibrate(60);}
function burst(){for(let i=0;i<8;i++){const s=document.createElement('div');s.className='fx';s.textContent=pick(['⭐','✨','🌟','💫']);s.style.left='50%';s.style.top='45%';const a=Math.random()*Math.PI*2,r=90+Math.random()*90;s.style.setProperty('--dx',Math.cos(a)*r+'px');s.style.setProperty('--dy',Math.sin(a)*r+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),1000);}}
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200);}

/* ===================== التنقّل ===================== */
let stack=[],timers=[],runId=0;
const T=(f,ms)=>{const i=setTimeout(f,ms);timers.push(i);return i;};
const I=(f,ms)=>{const i=setInterval(f,ms);timers.push(i);return i;};
function stopAll(){timers.forEach(i=>{clearTimeout(i);clearInterval(i);});timers=[];runId++;hush();}
function setTitle(t){$('#title').textContent=t;}
function render(){stopAll();const[fn,args]=stack[stack.length-1];window.scrollTo(0,0);fn(...args);$('#backBtn').style.visibility=stack.length>1?'visible':'hidden';updateStars();}
function go(fn,...args){stack.push([fn,args]);history.pushState({d:stack.length},'');render();}
function replaceRoot(fn){stack=[[fn,[]]];history.replaceState({d:1},'');render();}
function goHome(){const n=stack.length-1;if(n>0)history.go(-n);}
window.addEventListener('popstate',e=>{const d=(e.state&&e.state.d)||1;if(stack.length<=1)return;while(stack.length>Math.max(1,d))stack.pop();render();});

let tr={};
function initTrace(ch){
  const wrap=$('.tracewrap');wrap.innerHTML='<canvas id="cvg" width="320" height="320"></canvas><canvas id="cvd" width="320" height="320"></canvas>';
  const font='bold 220px "Noto Naskh Arabic","Amiri","Traditional Arabic",serif';
  const g=$('#cvg').getContext('2d');g.font=font;g.textAlign='center';g.textBaseline='middle';g.direction='rtl';
  g.fillStyle='#EEE8FF';g.fillText(ch,160,170);g.setLineDash([6,8]);g.lineWidth=3;g.strokeStyle='#B9A8F5';g.strokeText(ch,160,170);
  const m=document.createElement('canvas');m.width=m.height=320;const mc=m.getContext('2d');
  mc.font=font;mc.textAlign='center';mc.textBaseline='middle';mc.direction='rtl';mc.fillStyle='#000';mc.strokeStyle='#000';mc.lineWidth=28;mc.lineJoin='round';mc.fillText(ch,160,170);mc.strokeText(ch,160,170);
  tr.mask=mc.getImageData(0,0,320,320).data;
  const d=$('#cvd'),c=d.getContext('2d');c.lineWidth=20;c.lineCap='round';c.lineJoin='round';c.strokeStyle='#6C4BD8';c.fillStyle='#6C4BD8';tr.ctx=c;
  let on=false,last=null;
  const pos=e=>{const r=d.getBoundingClientRect();return[(e.clientX-r.left)*320/r.width,(e.clientY-r.top)*320/r.height];};
  d.onpointerdown=e=>{on=true;last=pos(e);try{d.setPointerCapture(e.pointerId);}catch(_){}c.beginPath();c.arc(last[0],last[1],10,0,7);c.fill();};
  d.onpointermove=e=>{if(!on)return;const p=pos(e);c.beginPath();c.moveTo(last[0],last[1]);c.lineTo(p[0],p[1]);c.stroke();last=p;};
  d.onpointerup=d.onpointercancel=()=>on=false;
}
function checkTrace(L){
  const d=tr.ctx.getImageData(0,0,320,320).data;let m=0,both=0,dr=0,out=0;
  for(let k=3;k<d.length;k+=16){const a=tr.mask[k]>0,b=d[k]>0;if(a)m++;if(b){dr++;if(a)both++;else out++;}}
  if(dr<30){toast('اكتب الحرف أوّلاً ✍️');return;}
  const cov=both/m,o=out/dr;
  if(cov>0.4&&o<0.45){good();const p=P();if(!p.learned[L.c]){p.learned[L.c]=1;save();addStar(2);toast('أحسنت! تعلّمت حرف '+strip(L.n)+' 🎉');}else{addStar();toast('ممتاز! 👏');}say('أَحْسَنْتَ');}
  else{bad();toast(cov<=0.4?'أكمل كتابة الحرف 💪':'حاول أن تكتب فوق الحرف 💪');}
}

function finish(g,score,total,extra){

}

/* ---------- ركن الوالدين ---------- */
function scrGate(){
  setTitle('ركن الوالدين 🔒');const a=3+Math.floor(Math.random()*7),b=3+Math.floor(Math.random()*7);
  app.innerHTML=`<div class="card center"><div class="huge">🔒</div><h3>هذا الركن للوالدين</h3><p style="font-size:22px">كم يساوي ${a} × ${b} ؟</p>
  <input type="number" id="ans" inputmode="numeric"><div class="row"><button class="btn big" id="go">دخول</button></div></div>`;
  $('#go').onclick=()=>{if(+$('#ans').value===a*b){stack[stack.length-1]=[scrParents,[]];render();}else{bad();toast('إجابة غير صحيحة');}};
}
function scrParents(){
  const p=P();setTitle('لوحة الوالدين 📊');
  const learned=Object.keys(p.learned).length,read=Object.keys(p.read).length,st=Object.keys(p.stories).length;
  const days=[];const DN=['أحد','إثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];
  for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();days.push([DN[d.getDay()],Math.round((p.secs[k]||0)/60)]);}
  const mx=Math.max(5,...days.map(d=>d[1]));const week=days.reduce((a,d)=>a+d[1],0);
  const weak=LETTERS.map(l=>{const e=p.err[l.c]||0,o=p.ok[l.c]||0;return{l,e,r:e/(e+o||1)};}).filter(x=>x.e>=2).sort((a,b)=>b.r-a.r).slice(0,6);
  const notYet=LETTERS.filter(l=>!p.learned[l.c]).map(l=>l.c);
  const gname=Object.fromEntries(GAMES.map(g=>[g.id,g.e+' '+g.n]));gname.story='📚 أسئلة القصص';
  const grow=Object.entries(p.games).map(([k,g])=>`<tr><td>${gname[k]||k}</td><td>${g.played||0}</td><td>${g.t?Math.round(g.c/g.t*100)+'%':'—'}</td></tr>`).join('');
  app.innerHTML=`
  <div class="card hello"><div class="av">${p.avatar}</div><div><div class="hi">${esc(p.name)}</div><div class="mut">⭐ ${p.stars} نجمة</div></div></div>
  <div class="card"><h3>التقدّم</h3><div class="stat"><div><b>${learned}/28</b><small>حروف مكتسبة</small></div><div><b>${read}/${READ.length}</b><small>كلمات مقروءة</small></div><div><b>${st}/${STORIES.length}</b><small>قصص مفهومة</small></div></div>
  <div class="bar" style="margin-top:12px"><i style="width:${learned/28*100}%"></i></div></div>
  <div class="card"><h3>وقت التعلّم (آخر 7 أيّام): ${week} دقيقة</h3><div class="chart">${days.map(d=>`<div><span>${d[1]}</span><i style="height:${d[1]/mx*80}%"></i>${d[0]}</div>`).join('')}</div></div>
  <div class="card"><h3>حروف تحتاج إلى مراجعة</h3>${weak.length?`<div class="weak">${weak.map(x=>`<span class="ar">${x.l.c}</span>`).join('')}</div>`:'<p class="mut">لا توجد حروف صعبة حاليًّا 👍</p>'}
  ${notYet.length&&notYet.length<28?`<p class="mut">لم يكتبها بعد: <span class="ar" style="font-size:20px">${notYet.join(' ')}</span></p>`:''}</div>
  <div class="card"><h3>الألعاب</h3>${grow?`<table><tr><th>اللعبة</th><th>مرّات</th><th>الدقّة</th></tr>${grow}</table>`:'<p class="mut">لم يلعب بعد.</p>'}</div>
  <div class="card"><h3>سرعة الصوت</h3><div class="seg">${[[0.6,'بطيء'],[0.8,'عادي'],[1,'سريع']].map(r=>`<button data-r="${r[0]}" class="${DB.rate==r[0]?'on':''}">${r[1]}</button>`).join('')}</div>
  <div class="row"><button class="btn ghost" id="tst">🔊 تجربة الصوت</button></div>
  <p class="mut" style="font-size:13px">إذا لم تسمع صوتًا، ثبّت اللغة العربيّة في إعدادات الهاتف: الإعدادات ← تحويل النصّ إلى كلام ← محرّك Google ← تثبيت بيانات الصوت ← العربيّة.</p></div>
  <div class="card"><h3>الأطفال</h3><div class="row"><button class="btn" id="sw">🔄 تغيير الطفل</button><button class="btn ghost" id="add">➕ إضافة طفل</button></div>
  <div class="row"><button class="btn ghost" id="rst">♻️ تصفير تقدّم ${esc(p.name)}</button><button class="btn red" id="del">🗑️ حذف</button></div></div>`;
  $$('.seg button').forEach(b=>b.onclick=()=>{DB.rate=+b.dataset.r;save();$$('.seg button').forEach(x=>x.classList.toggle('on',x===b));say('مَرْحَبًا بِكُمْ فِي بُسْتَانِ الْحُرُوفِ');});
  $('#tst').onclick=()=>say('مَرْحَبًا بِكُمْ فِي بُسْتَانِ الْحُرُوفِ');
  $('#sw').onclick=()=>replaceRoot(scrProfiles);
  $('#add').onclick=()=>go(scrAddChild);
  $('#rst').onclick=()=>{if(confirm('هل تريد تصفير كلّ تقدّم '+p.name+'؟')){Object.assign(p,{stars:0,learned:{},err:{},ok:{},games:{},read:{},stories:{},secs:{}});save();render();toast('تمّ التصفير');}};
  $('#del').onclick=()=>{if(confirm('حذف ملفّ '+p.name+' نهائيًّا؟')){DB.profiles=DB.profiles.filter(x=>x.id!==p.id);DB.current=DB.profiles[0]?DB.profiles[0].id:null;save();replaceRoot(DB.profiles.length?scrProfiles:scrAddChild);}};
}

/* ===================== البداية ===================== */
function start(){
  if(!DB.profiles.length)replaceRoot(scrAddChild);
  else if(!P()){replaceRoot(scrProfiles);}
  else replaceRoot(scrHome);
}
start();
setTimeout(()=>$('#splash').classList.add('hide'),1800);
setTimeout(()=>$('#splash').remove(),2500);
if('serviceWorker' in navigator&&!isNative&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
